# Bộ thu nhật ký của mình: nhận vết / log / số đo qua OTLP rồi CHỈ IN RA MÀN HÌNH (docker logs capitol-otel).
# Không gửi đi đâu.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
    logs:
      receivers: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      exporters: [debug]
