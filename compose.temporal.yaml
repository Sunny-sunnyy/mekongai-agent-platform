      - ./sua_doi/nodes/output/_do_thi_khoi.py:/srv/src/nodes/output/_do_thi_khoi.py:ro
      # [Q1 09/11] gỡ bản thay mục 59 — bật lại: bỏ dấu #   - ./sua_doi/nodes/output/org_chart/node.py:/srv/src/nodes/output/org_chart/node.py:ro
      # [09/11/2026, B — MỤC 61, D ĐẠT] khối Người duyệt: ghi chú + NGUYÊN VĂN sẽ gửi (cờ CHAY_THU_NGUOI_DUYET, mặc định bật) — va_nguoi_duyet/
      - ./sua_doi/nodes/logic/human_intervention/node.py:/srv/src/nodes/logic/human_intervention/node.py:ro
      - ./va_xuat_ket_qua/dung_file.py:/srv/src/nodes/logic/human_intervention/dung_file_nhap.py:ro   # [ghi chú] bộ dựng Excel NHÁP có nhãn cho lượt tự duyệt khi quá hạn
      - ./sua_doi/nodes/logic/human_intervention/params.py:/srv/src/nodes/logic/human_intervention/params.py:ro
      # [09/11/2026, B] sql_query: [ghi chú] nay là BẢN 2 4e3e1de7 của B (đã chốt 12:23; bản trước 25975106 = sql_query.py.truoc_kiem_sql, D ĐẠT bổ sung 2, 06/11 — bao_cao_ket_qua/04_CONG_CU_AGENT_VA_BO_THU_SOAT.md), KHÔNG gắn file đang sửa sql_chi_doc/sql_query.py
      - ./sua_doi/nodes/agent/sql_query.py:/srv/src/nodes/agent/sql_query.py:ro
