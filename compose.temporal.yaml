# Bước 6 — thêm Temporal (bộ chạy bền) vào bộ lõi. Dùng CHỒNG lên compose.yaml:
#   docker compose -f compose.yaml -f compose.temporal.yaml ...
# Viết 03/11/2026. Chỉ chạy qua buoc6_bat_temporal.sh.
#
# Vì sao cần: chạy lại từ một khối, tạm dừng / chạy tiếp, hỏi lại người — code từ chối (400) khi USE_TEMPORAL tắt
# (src/api/routers/workflow.py:303-330, src/api/v1/handlers/run.py:2231-2249).
# Search attribute OrgId / UserId / WorkflowName: API gắn khi bắt đầu workflow (src/api/routers/workflow.py:129-157)
# — namespace phải khai trước, nếu không Temporal từ chối.

services:
  temporal:
    image: temporalio/temporal:1.4.1
    container_name: capitol-temporal
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--namespace", "capitol",
              "--search-attribute", "OrgId=Keyword",
              "--search-attribute", "UserId=Keyword",
              "--search-attribute", "WorkflowName=Keyword", "--db-filename", "/home/temporal/temporal.db"]   # [ghi chú] lưu bền
    # [ghi chú] KHÔNG ports: — cổng máy đi qua hộp gác capitol-cong-ngoai (compose.cong_ngoai.yaml, chặn Host / Origin lạ)
    mem_limit: 768m
    volumes:
      - capitol_temporal:/home/temporal   # [ghi chú] file temporal.db; thư mục có sẵn trong image, chủ temporal (uid 1000)

  # API dùng thêm env/temporal.env (đặt sau ⇒ ghi đè USE_TEMPORAL=false của file chính)
  ab-api:
    env_file:
      - ./env/temporal.env
    depends_on:
      temporal:
        condition: service_started

  # Worker của đường Temporal (khác worker hàng đợi Redis). Lệnh: src/temporal/worker.py (_run_worker), health ở cổng 8080.
  ab-worker-temporal:
    image: capitol-local/agentic-backend:release-4.10.0
    container_name: capitol-ab-worker-temporal
    environment:
      CHAY_THU_RAO_CHAN_CHAN: "${CHAY_THU_RAO_CHAN_CHAN:-true}"   # bật: CHAY_THU_RAO_CHAN_CHAN=true docker compose … up -d --force-recreate ab-api ab-worker ab-worker-temporal
      CHAY_THU_MCP_CHO_PHEP: "${CHAY_THU_MCP_CHO_PHEP:-mcp-shop,mcp-exa}"   # [ghi chú] lớp nền chỉ cho MCP trong danh sách (node.py.ci_hop_phien :139-175)
      CHAY_THU_KIEM_SO_SO: "/srv/kiem_so_kpi"   # [ghi chú] nơi khối Agent ghi sổ phiếu kiểm số
      SANDBOX_TOOL_OUTPUT_MAX_CHARS: "30000"   # [ghi chú] gốc 200.000 ⇒ 1 lần gọi ≤ 200k + 8k + ~58k (ca xấu) < 272k
      RAG_CONG_URL: "http://host.docker.internal:19453/api/v1/search"   # [ghi chú] hộp cổng capitol-rag-cong (chỉ /search)
      CHAY_THU_CHAN_LOI_MEM: "chan"   # [ghi chú] lớp chặn lỗi mềm (kiem_loi_mem.py); lùi: MUC=do
      CHAY_THU_E2B_KHOI: "code_interpreter"   # [ghi chú] CHỈ flexible_code_interpreter_node đi E2B (cần thêm CHAY_THU_E2B_KHOA từ e2b.env)
      CHAY_THU_E2B_TTL: "180"   # [ghi chú] E2B tự tắt máy sau 180 s (kẹp 30–180), không keepalive — BẰNG E2B_TTL_GIAY ở muc_toi_da.py
      CHAY_THU_E2B_DS: "/srv/e2b_ds/file_gia_lap.txt"   # [ghi chú] chỉ file có sha trong danh sách GIẢ LẬP mới lên E2B
      CHAY_THU_E2B_MANG: "bat"   # [ghi chú] User M14: mạng RA bật trong giai đoạn thử — TẮT ("tat") trước khi có người dùng thật
      CHAY_THU_E2B_FILE: "nguoi_dung"   # [ghi chú] file NGƯỜI DÙNG tải lên được lên E2B (loại file + cỡ ≤ 20 MB + không giống file khoá + soát khoá trong nội dung); gỡ dòng này = chỉ file giả lập
      CHAY_THU_E2B_TEMPLATE: "chay-thu-e2b-doc:v2"   # [ghi chú] [ghi chú] template tự viết (đọc PDF / Word mekongai + OCR vie), 1 vCPU / 1 GiB; bản trước "code-interpreter-v1"
      CHAY_THU_E2B_GIA: "/srv/e2b_gia/gia_e2b.json"   # [ghi chú] bảng giá MỘT nguồn (va_e2b/gia_e2b.json, ro) — template ngoài bảng ⇒ không tạo máy
      CHAY_THU_E2B_SO: "/srv/e2b_so"   # [ghi chú] sổ máy E2B (dòng tao TRƯỚC mỗi máy; thiếu ⇒ không tạo) — chay_s5.tien_luot đọc
      E2B_TEMPLATE: "chay-thu-sandbox-py-v3:v3"   # [ghi chú] 2.2a lời dặn khớp hộp thật
      E2B_CODE_INTERPRETER_TEMPLATE: "chay-thu-sandbox-py-v3:v3"   # [ghi chú] 2.2a lời dặn khớp hộp thật
      E2B_SKILL_PPTX_TEMPLATE: "chay-thu-sandbox-py-v3:v3"   # [ghi chú] 2.2a lời dặn khớp hộp thật
      E2B_SKILL_DOCX_TEMPLATE: "chay-thu-sandbox-py-v3:v3"   # [ghi chú] 2.2a lời dặn khớp hộp thật
      E2B_SKILL_XLSX_TEMPLATE: "chay-thu-sandbox-py-v3:v3"   # [ghi chú] 2.2a lời dặn khớp hộp thật
      E2B_SKILL_EY_PPTX_TEMPLATE: "chay-thu-sandbox-py-v3:v3"   # [ghi chú] 2.2a lời dặn khớp hộp thật
      E2B_SKILL_D3_TEMPLATE: "chay-thu-sandbox-py-v3:v3"   # [ghi chú] 2.2a lời dặn khớp hộp thật
      E2B_SKILL_ORG_CHART_TEMPLATE: "chay-thu-sandbox-py-v3:v3"   # [ghi chú] 2.2a lời dặn khớp hộp thật
      A2A_TASK_ALIGNMENT_GUARDRAIL_ENABLED: "false"   # [ghi chú] giám khảo task-alignment TẮT RÕ (A 17/11): chưa chứng minh lượt giám khảo vào sổ tiền (AGENTS 3.9); bật = bước sau
      TEMPORAL_THUMBNAIL_TASK_QUEUE: ""   # [ghi chú] bộ không có thumbnail_worker ⇒ dựng ảnh trong tiến trình
      DB_POOL_SIZE: "5"   # [ghi chú] mặc định 20 + 40 / tiến trình so với Postgres max_connections 100
      DB_MAX_OVERFLOW: "5"   # [ghi chú]
      DB_POOL_SIZE_WORKER: "2"   # [ghi chú]
      DB_MAX_OVERFLOW_WORKER: "2"   # [ghi chú]
      NOTIFICATION_SERVICE_BASE_URL: ""   # [ghi chú] mặc định notification_service:80 không có ⇒ tắt gửi
      A2A_HISTORY_TIERED_ENABLED: "false"   # [ghi chú] tắt bước TÓM TẮT LỊCH SỬ chat bằng AI sau lượt (gốc True, core/settings.py:1006): chạy nền, ngoài trần token + ngoài sổ tiền; trang kiểm cờ này trước mỗi lượt chat
      AGENT_REQUEST_LIMIT: "20"   # [ghi chú] gốc 200 (core/settings.py:724); đo 694 lượt agent_node: tối đa 7 lần gọi ⇒ trần tiền thật cùng TRAN_TOKEN_* trong bản vá base/agent/node.py
    env_file:
      - ./env/agentic-backend.env
      - path: ./env/agentic-backend.khoa.env
        required: false
      - path: ${CAPITOL_STATE_DIR:-${HOME}/.local/share/capitol-platform}/rag_cong.env   # [ghi chú] RAG_MA (file 600, ngoài repo) — giá trị KHÔNG ở đây
        required: false
      - path: ./env/e2b.khoa.env   # [ghi chú] CHAY_THU_E2B_KHOA (600, Git bỏ qua .gitignore:3) — giá trị KHÔNG ở đây; thiếu / rỗng ⇒ E2B tắt
        required: false
      - ./env/temporal.env
    working_dir: /srv/src
    command: ["python", "-m", "temporal.worker"]
    volumes:
      - ./sua_doi/core/config/ai/openai.py:/srv/src/core/config/ai/openai.py:ro
      - ./sua_doi/core/config/ai/registry.py:/srv/src/core/config/ai/registry.py:ro
      - ./sua_doi/ai/agentic/models/openai.py:/srv/src/ai/agentic/models/openai.py:ro
      # vá 8 (04/11, User yêu cầu): công cụ gọi thẳng (không qua MCP) + khuôn đầu ra có cấu trúc cho khối Agent — sua_doi/README.md "Vá 8"
      - ./sua_doi/nodes/agent/params.py:/srv/src/nodes/agent/params.py:ro
      - ./sua_doi/nodes/agent/node.py:/srv/src/nodes/agent/node.py:ro
      - ./sua_doi/nodes/agent/kiem_so_ai.py:/srv/src/nodes/agent/kiem_so_ai.py:ro   # [ghi chú] mô-đun kiểm số bằng AI của khối Agent
      - ${CAPITOL_RUNTIME_DIR:-./runtime}/kiem_so_kpi:/srv/kiem_so_kpi   # [ghi chú] sổ phiếu kiểm số — GHI ĐƯỢC
      - ./sua_doi/nodes/agent/native_tools.py:/srv/src/nodes/agent/native_tools.py:ro
      - ./sua_doi/nodes/agent/rag_tool.py:/srv/src/nodes/agent/rag_tool.py:ro   # [ghi chú] công cụ rag_search (E ĐẠT)
      - ./sua_doi/nodes/agent/kiem_loi_mem.py:/srv/src/nodes/agent/kiem_loi_mem.py:ro   # [ghi chú]
      - ./sua_doi/nodes/agentic_deep_research/node.py:/srv/src/nodes/agentic_deep_research/node.py:ro   # [ghi chú] trần cộng dồn cả khối
      - ./sua_doi/ai/agentic/cache_observability.py:/srv/src/ai/agentic/cache_observability.py:ro   # [ghi chú] [CACHE_USAGE] có session=
