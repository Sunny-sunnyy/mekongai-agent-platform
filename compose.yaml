      # [09/11/2026, B — MỤC 61, D ĐẠT] khối Người duyệt: ghi chú + NGUYÊN VĂN sẽ gửi (cờ CHAY_THU_NGUOI_DUYET, mặc định bật) — va_nguoi_duyet/
