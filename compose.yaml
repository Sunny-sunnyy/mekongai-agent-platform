  # ---------- platform-api ("phòng hồ sơ") ----------
  # Dữ liệu chỉ nằm trong RAM (-inMemory): tắt là mất — đủ cho lần thử đầu, tránh lỗi quyền ghi thư mục.
  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    container_name: capitol-dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]   # [ghi chú] bền (trước: -inMemory)
    volumes:
      - capitol_dynamodb:/home/dynamodblocal/data   # [ghi chú] 1 file shared-local-instance.db; quyền uid 1000: gan.sh BUOC=quyen
    mem_limit: 768m

  platform-api:
    image: capitol-local/platform-api:release-1.82.0
    container_name: capitol-platform-api
    env_file: ./env/platform-api.env
    # giống lệnh gốc nhưng 1 tiến trình thay vì 4
    command: ["gunicorn", "-w", "1", "-k", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:80",
              "main:create_app()", "--timeout", "100"]
    # [ghi chú] KHÔNG ports: — cổng máy đi qua hộp gác capitol-cong-ngoai (compose.cong_ngoai.yaml, chặn Host / Origin lạ)
    depends_on:
      - dynamodb
    extra_hosts:   # [ghi chú]
