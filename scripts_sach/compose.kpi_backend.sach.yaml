# Cấu hình sạch cho dịch vụ kpi-backend (đã tách khỏi đường dẫn máy cố định)
# Dùng cùng tệp mã nguồn kpi_agent/ (bản đóng băng) và thư mục dữ liệu mẫu sample_data/thang_10/.
# Đường dẫn trạng thái và kết quả chạy lấy qua biến CAPITOL_RUNTIME_DIR (mặc định ./runtime).

services:
  kpi-backend:
    image: ${KPI_BACKEND_IMAGE:-capitol-local/kpi-backend:c1b4111a}
    build:
      context: ./docker_build/kpi-backend
      dockerfile: Dockerfile
    container_name: capitol-kpi-backend
    restart: unless-stopped
    working_dir: /srv/kpi
    entrypoint: []
    command:
      - python
      - -m
      - uvicorn
      - --app-dir
      - /srv/kpi
      - kpi_agent.backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8110"
    env_file:
      - ./env/kpi.khoa.env
    environment:
      PYTHONPATH: /srv/kpi
      KPI_STORE: /srv/kpi_store/kpi_store.sqlite
      KPI_STORE_DIR: /srv/kpi_store
      KPI_UPLOAD_DIR: /srv/kpi_store/uploads
      KPI_ALLOWED_HOSTS: kpi-backend,127.0.0.1,localhost
      KPI_SYSTEM_ONLY: "1"
      KPI_WARM_SPICE: "on"
      KPI_NAMES: "on"
      KPI_CUTOFF: ${KPI_CUTOFF:-2026-10-31}
      KPI_RULES_YAML: /srv/kpi/kpi_agent/config/rules_2026_10_raw.yaml
      KPI_EXTRA_BONUS_YAML: /srv/kpi/kpi_agent/config/extra_bonus_2026_10.yaml
      KPI_WORKFLOW: /srv/kpi/kpi_agent/workflows/kpi_thuong_nvbh_raw.yaml
      KPI_WORKFLOW_TEMPLATE: /srv/kpi/kpi_agent/workflows/kpi_thuong_nvbh_raw.yaml
      KPI_DEFAULT_WORKFLOW: kpi_thuong_nvbh_raw
      KPI_EMPTY_PERIOD: ${KPI_EMPTY_PERIOD:-}
    volumes:
      - ./kpi_agent:/srv/kpi/kpi_agent:ro
      - ./sample_data/thang_10:/srv/kpi/sample_data/thang_10:ro
      - ${CAPITOL_RUNTIME_DIR:-./runtime}/kpi_store:/srv/kpi_store
    ports:
      - "127.0.0.1:18401:8110"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8110/api/meta', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      kpi_noi_bo:
        aliases: ["kpi-backend"]

networks:
  kpi_noi_bo:
    internal: true
