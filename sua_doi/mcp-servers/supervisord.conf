# Qdrant API MCP Server (HTTP mode on port 8009)
[program:qdrant_api_server]
command=/usr/bin/env node /usr/local/lib/node_modules/qdrant-api-mcp/dist/mcp-server.js
directory=/srv
# [ghi chú] HOST 0.0.0.0 ⇒ 127.0.0.1: hộp khác gọi thẳng :8009 vòng qua nginx (create / delete collection, không mã). Bộ không dùng server này.
environment=PORT="8009",HOST="127.0.0.1",QDRANT_URL="%(ENV_QDRANT_URL)s",QDRANT_API_KEY="%(ENV_QDRANT_API_KEY)s",QDRANT_CLUSTER_PROFILES="%(ENV_QDRANT_CLUSTER_PROFILES)s",QDRANT_DEFAULT_CLUSTER="%(ENV_QDRANT_DEFAULT_CLUSTER)s"
autostart=true
autorestart=true
startretries=5
startsecs=5
process_name=%(program_name)s_%(process_num)02d
stderr_logfile=/var/log/supervisor/%(program_name)s_stderr.log
stderr_logfile_maxbytes=10MB
stdout_logfile=/var/log/supervisor/%(program_name)s_stdout.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true
priority=20

