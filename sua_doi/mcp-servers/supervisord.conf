[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=debug
pidfile=/var/run/supervisord.pid

# Create log directory
[program:create_log_dir]
command=mkdir -p /var/log/supervisor
autostart=true
autorestart=false
startretries=0
startsecs=0
priority=1

# Nginx
# Render nginx.conf from the template at start so ${IMAGE_URI}/${APP_VERSION}/
# ${GIT_*} resolve from runtime env. The envsubst whitelist is explicit so
# nginx's own $-variables (e.g. $request in log_format) are left intact.
[program:nginx]
command=/bin/sh -c "envsubst '$IMAGE_URI $APP_VERSION $GIT_SHORT_SHA $GIT_BRANCH_NAME' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"
autostart=true
autorestart=true
startretries=5
numprocs=1
startsecs=0
process_name=%(program_name)s_%(process_num)02d
stderr_logfile=/var/log/supervisor/%(program_name)s_stderr.log
stderr_logfile_maxbytes=10MB
redirect_stderr=true
stdout_logfile=/var/log/supervisor/%(program_name)s_stdout.log
stdout_logfile_maxbytes=10MB
priority=10

